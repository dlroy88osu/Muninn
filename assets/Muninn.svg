<svg width="100%" viewBox="0 0 1000 400" role="img" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <clipPath id="mcut">
            <rect x="60" y="-100" width="300" height="182" transform="rotate(-45 206 108)" />
            <rect x="60" y="90" width="300" height="14" transform="rotate(-45 206 108)" />
            <rect x="60" y="112" width="300" height="14" transform="rotate(-45 206 108)" />
            <rect x="60" y="134" width="300" height="186" transform="rotate(-45 206 108)" />
        </clipPath>

        <mask id="i-slash" maskUnits="userSpaceOnUse" x="374" y="40" width="24" height="24">
            <rect x="374" y="40" width="24" height="24" fill="#fff" />
            <rect x="382.5" y="36" width="3" height="28" fill="#000" transform="rotate(40 386 52)" />
        </mask>
    </defs>


    <g id="background">
        <rect width="100%" height="100%" fill="#3f5b80" />
    </g>

    <g transform="translate(-350, -80) scale(2.5)">
        <!-- m -->
        <g clip-path="url(#mcut)">
            <path d="M172 140 V93 A17 17 0 0 1 206 93 V140 M206 93 A17 17 0 0 1 240 93 V140" fill="none"
                stroke="#D98E32" stroke-width="15" stroke-linecap="round" color="rgb(11, 11, 11)" />
        </g>

        <!-- u -->
        <path d="M266 76 V123 A17 17 0 0 0 300 123 V76" fill="none" stroke="rgb(11, 11, 11)" stroke-width="15"
            stroke-linecap="round" color="rgb(11, 11, 11)" />

        <!-- n -->
        <path d="M326 140 V93 A17 17 0 0 1 360 93 V140" fill="none" stroke="rgb(11, 11, 11)" stroke-width="15"
            stroke-linecap="round" color="rgb(11, 11, 11)" />

        <!-- i body -->
        <path d="M386 76 V140" fill="none" stroke="rgb(11, 11, 11)" stroke-width="15" stroke-linecap="round"
            color="rgb(11, 11, 11)" />

        <!-- i dot -->
        <circle cx="386" cy="52" r="7.5" fill="#D98E32" mask="url(#i-slash)" />

        <!-- n -->
        <path d="M412 140 V93 A17 17 0 0 1 446 93 V140" fill="none" stroke="rgb(11, 11, 11)" stroke-width="15"
            stroke-linecap="round" color="rgb(11, 11, 11)" />

        <!-- n -->
        <path d="M472 140 V93 A17 17 0 0 1 506 93 V140" fill="none" stroke="rgb(11, 11, 11)" stroke-width="15"
            stroke-linecap="round" color="rgb(11, 11, 11)" />

        <!-- tagline -->
        <text x="340" y="178" text-anchor="middle" letter-spacing="3px" color="rgb(11, 11, 11)"
            font-family="anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif"
            font-size="20px" font-weight="500" dominant-baseline="auto" fill="#b8b4a9">logging for Odin</text>
    </g>
</svg>
